<!DOCTYPE html>
<html lang="pl" wp-template wp-template-export-as="archive-realizacje.php" wp-template-no-export>
    <!-- =========================================================================
         SZABLON WZORCOWY: archiwum CPT (tu przykład "realizacje").
         Skill /nowy-cpt kopiuje ten plik i podmienia slug (realizacje -> twoj-cpt)
         oraz taksonomię (realizacje_kategorie). Header/stopka z mastera (index.html).
         ========================================================================= -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Archiwum CPT</title>
        <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div wp-site-content>
            <section class="mx-auto max-w-site px-5 py-10 lg:py-16">
                <div class="hidden pb-6 lg:block">
                    <div cms-template-part="template-parts/breadcrumbs-cpt">Breadcrumbs</div>
                </div>
                <h1 class="mb-8 text-2xl font-bold text-gray-900 lg:text-4xl" cms-function="code" cms-function-code="echo esc_html( post_type_archive_title('', false) );" cms-function-type="content" data-anim="fade-up">Realizacje</h1>

                <div cms-post="loop" cms-post-type="realizacje" cms-post-type-order="date DESC" cms-post-repeat="> div:nth-of-type(1) > article" cms-post-items-container="> div:nth-of-type(1)" cms-post-show-empty-element="> div:nth-of-type(2)">
                    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
                        <article class="group relative overflow-hidden rounded-lg bg-white shadow-md transition-shadow duration-300 hover:shadow-lg" data-anim="fade-up">
                            <a href="#" class="absolute inset-0 z-10" cms-post-link aria-label="Otwórz realizację"></a>
                            <div class="overflow-hidden">
                                <img src="https://pinegrow.com/placeholders/img5.jpg" class="h-52 w-full object-cover transition-transform duration-300 group-hover:scale-105" cms-post-image="medium" cms-post-image-sizes="(max-width: 1024px) 92vw, 420px" wp-if-has-post-thumbnail alt="Miniatura realizacji" loading="lazy">
                                <img src="https://pinegrow.com/placeholders/img5.jpg" class="h-52 w-full object-cover" wp-if-has-post-thumbnail="!" alt="" loading="lazy">
                            </div>
                            <div class="p-5">
                                <div cms-tags="realizacje_kategorie" cms-tags-display="this" cms-tags-delimiter=" " cms-tags-range="0-1" class="mb-3">
                                    <span class="inline-block rounded-full bg-secondary-500/10 px-3 py-1 text-sm text-secondary-600">Kategoria</span>
                                </div>
                                <h2 class="mb-2 text-lg font-bold text-gray-900 transition-colors group-hover:text-primary-500" cms-post-title>Tytuł realizacji</h2>
                                <time class="text-sm text-gray-500" datetime="2026-01-01" cms-post-date>1 stycznia 2026</time>
                            </div>
                        </article>
                    </div>
                    <div class="py-16 text-center">
                        <h2 class="mb-6 text-xl font-semibold text-gray-900">Brak elementów do wyświetlenia</h2>
                        <a href="/" cms-site-link="home" class="inline-flex items-center rounded-full bg-primary-500 px-6 py-4 text-base font-semibold text-white duration-300 hover:bg-primary-600 cursor-pointer">Wróć do strony głównej</a>
                    </div>
                </div>

                <div class="pt-10">
                    <div cms-template-part="template-parts/pagination"></div>
                </div>
            </section>
        </div>
    </body>
</html>
