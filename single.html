<!DOCTYPE html>
<html lang="pl" wp-template wp-template-export-as="single.php" wp-template-post-template-types="post" wp-template-post-template-name="Artykuł - standard">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Artykuł</title>
        <link href="tailwind_theme/tailwind.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div wp-site-content>
            <div cms-post="loop">
                <div class="mx-auto max-w-5xl px-5 py-8 lg:py-12">
                    <main id="content">
                        <header class="overflow-hidden pb-6" data-anim="fade">
                            <div class="hidden pb-6 lg:block">
                                <div cms-template-part="template-parts/breadcrumbs">Breadcrumbs</div>
                            </div>
                            <div class="relative">
                                <img src="https://pinegrow.com/placeholders/img11.jpg" class="relative z-0 max-h-[520px] min-h-56 w-full rounded-lg object-cover" cms-post-image="large" cms-post-image-sizes="(max-width: 1024px) 92vw, 1024px" wp-if-has-post-thumbnail alt="Zdjęcie główne wpisu" loading="lazy">
                                <div class="absolute inset-x-5 bottom-4 z-20 lg:inset-x-8 lg:bottom-8">
                                    <div cms-tags="category" cms-tags-display="child" cms-tags-delimiter=" " wp-if-in-category="!Uncategorized" class="mb-2 flex flex-row flex-wrap gap-2 lg:mb-4">
                                        <a class="block max-w-max rounded bg-primary-500 px-2 py-1 text-[10px] font-semibold text-white duration-300 hover:bg-primary-600 hover:scale-105 lg:text-sm cursor-pointer" href="#">Kategoria</a>
                                    </div>
                                    <h1 class="text-xl font-bold text-white sm:text-2xl lg:text-4xl" cms-post-title>Tytuł artykułu</h1>
                                </div>
                                <div class="absolute inset-x-0 bottom-0 z-10 h-4/6 rounded-b-lg bg-linear-to-t from-black/80 to-transparent"></div>
                            </div>
                        </header>
                        <article cms-post-content class="prose max-w-none py-8" data-anim="fade-up">
                            <p>Treść wpisu. Ten akapit zastępuje edytor WordPress przy renderowaniu artykułu.</p>
                        </article>
                        <section class="my-8 overflow-hidden">
                            <div class="flex flex-row items-center gap-5 border-y border-gray-200 py-6">
                                <img src="https://pinegrow.com/placeholders/img8.jpg" class="size-12 rounded-full object-cover" cms-author-field="avatar_image" cms-author-field-type="image" loading="lazy" alt="Autor">
                                <a href="" cms-author-field="display_name" cms-author-field-type="content" cms-author-field-type-2="link" cms-author-field-2="posts_url" class="text-base font-bold text-gray-900 hover:text-primary-500 cursor-pointer">Autor</a>
                            </div>
                        </section>
                    </main>
                </div>
            </div>
        </div>
    </body>
</html>
